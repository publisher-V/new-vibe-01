<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버블 메모장</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1 class="title">메모장</h1>
          <p class="subtitle">간단히 적고, 찾고, 다시 이어 쓰는 작은 메모 공간</p>
        </div>
        <div class="status" id="status">준비됨</div>
      </header>

      <section class="workspace" aria-label="메모장 앱">
        <aside class="sidebar" aria-label="메모 목록">
          <div class="search-wrap">
            <input class="search" id="searchInput" type="search" placeholder="메모 검색" autocomplete="off" />
          </div>
          <ul class="note-list" id="noteList"></ul>
        </aside>

        <section class="editor" aria-label="메모 편집">
          <div class="editor-actions">
            <div class="action-group">
              <button class="btn primary" id="newButton" type="button">새 메모</button>
              <button class="btn" id="saveButton" type="button">저장</button>
            </div>
            <button class="btn danger" id="deleteButton" type="button">삭제</button>
          </div>

          <input class="title-input" id="titleInput" type="text" placeholder="제목" maxlength="80" />
          <textarea class="memo-input" id="contentInput" placeholder="오늘의 메모를 적어보세요"></textarea>

          <div class="meta">
            <span id="updatedAt">아직 저장되지 않음</span>
            <span id="countInfo">0자</span>
          </div>
        </section>
      </section>
    </main>

    <script src="./js/main.js"></script>
  </body>
</html>
